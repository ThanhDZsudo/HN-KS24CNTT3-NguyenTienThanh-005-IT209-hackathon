server{
    listen 8081;
    listen [::]:8081;

    server_name nguyentienthanh-k24cntt3;
    
    root /var/www/nguyentienthanh-k24cntt3;
    index index.html index.htm index.php;

    access_log /var/log/nginx/nguyentienthanh-k24cntt3.access.log;
    error_log /var/log/nginx/nguyentienthanh-k24cntt3.error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /var/www/beta-app/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}

